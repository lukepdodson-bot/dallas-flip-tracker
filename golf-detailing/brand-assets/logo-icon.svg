<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Caddy 19 emblem">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c987"/>
      <stop offset="0.5" stop-color="#c8a24a"/>
      <stop offset="1" stop-color="#a9863a"/>
    </linearGradient>
  </defs>
  <g transform="translate(128,128)">
    <circle r="122" fill="#0b3d2c"/>
    <circle r="122" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle r="107" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.55"/>

    <!-- arched top/bottom text -->
    <path id="li-top" d="M -86 0 A 86 86 0 0 1 86 0" fill="none"/>
    <path id="li-bot" d="M -74 26 A 74 74 0 0 0 74 26" fill="none"/>
    <text font-family="Georgia, serif" font-size="16" font-weight="700" letter-spacing="4" fill="url(#gold)">
      <textPath href="#li-top" startOffset="50%" text-anchor="middle">CADDY 19</textPath>
    </text>
    <text font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="url(#gold)" opacity="0.85">
      <textPath href="#li-bot" startOffset="50%" text-anchor="middle">DALLAS · FORT WORTH</textPath>
    </text>

    <!-- hero 19 -->
    <text x="0" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-2">19</text>

    <!-- flag -->
    <g transform="translate(2,-30)">
      <rect x="-1.6" y="-32" width="3.2" height="46" rx="1.6" fill="url(#gold)"/>
      <path d="M 1.6 -32 L 24 -25 L 1.6 -18 Z" fill="url(#gold)"/>
    </g>
    <!-- shine sparkle -->
    <g transform="translate(46,-42)" fill="#ffffff"><path d="M 0 -10 L 2.4 -2.4 L 10 0 L 2.4 2.4 L 0 10 L -2.4 2.4 L -10 0 L -2.4 -2.4 Z" opacity="0.95"/></g>
  </g>
</svg>

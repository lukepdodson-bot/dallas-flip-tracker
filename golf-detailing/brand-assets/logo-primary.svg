<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-label="Fairway Detail Co. logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c987"/>
      <stop offset="0.5" stop-color="#c8a24a"/>
      <stop offset="1" stop-color="#a9863a"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(140,140)">
    <circle r="118" fill="#0b3d2c"/>
    <circle r="118" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <circle r="104" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.55"/>

    <!-- putting-green mound -->
    <path d="M -78 46 Q 0 14 78 46 L 78 70 Q 0 92 -78 70 Z" fill="#12583e"/>
    <ellipse cx="0" cy="46" rx="78" ry="16" fill="#157049" opacity="0.6"/>

    <!-- flagstick + flag -->
    <rect x="-2.5" y="-64" width="5" height="112" rx="2.5" fill="url(#gold)"/>
    <path d="M 2.5 -64 L 58 -49 L 2.5 -30 Z" fill="url(#gold)"/>
    <circle cx="0" cy="48" r="5" fill="#0b3d2c" stroke="url(#gold)" stroke-width="2.5"/>

    <!-- shine sparkle (the 'detail' cue) -->
    <g transform="translate(44,-8)" fill="#ffffff">
      <path d="M 0 -18 L 4 -4 L 18 0 L 4 4 L 0 18 L -4 4 L -18 0 L -4 -4 Z" opacity="0.95"/>
    </g>
    <circle cx="66" cy="18" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="30" cy="20" r="2" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300,0)">
    <text x="0" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" letter-spacing="2" fill="#0b3d2c">FAIRWAY</text>
    <g transform="translate(4,150)">
      <line x1="0" y1="0" x2="120" y2="0" stroke="url(#gold)" stroke-width="3"/>
      <text x="140" y="9" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" letter-spacing="8" fill="#33463d" text-anchor="middle">DETAIL CO.</text>
      <line x1="272" y1="0" x2="392" y2="0" stroke="url(#gold)" stroke-width="3"/>
    </g>
    <text x="4" y="205" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="3" fill="#4a6357">YOU PLAY. WE DETAIL. DRIVE HOME BRAND NEW.</text>
  </g>
</svg>
